<div class="flex flex-col gap-1.5 w-full">
  @if (label()) {
    <label class="text-sm font-medium text-gray-600">{{ label() }}</label>
  }

  <div
    class="flex items-center gap-2 h-12 px-4 bg-white border rounded-xl transition-colors duration-200 overflow-hidden"
    [ngClass]="{
      'border-blue-500 ring-2 ring-blue-50': isFocused() && !error(),
      'border-red-500': error(),
      'border-gray-200 hover:border-gray-300': !isFocused() && !error(),
      'opacity-60 cursor-not-allowed bg-gray-50': isDisabled()
    }"
  >
    @if (icon()) {
      <span class="flex items-center justify-center shrink-0 text-gray-400">
        <i [class]="icon()"></i>
      </span>
    }

    <input
      class="flex-1 w-full bg-transparent border-none outline-none text-sm text-gray-800 placeholder-gray-400 disabled:cursor-not-allowed"
      [attr.inputmode]="type() === 'number' ? 'numeric' : null"
      [disabled]="isDisabled()"
      [placeholder]="placeholder()"
      [type]="currentType()"
      [value]="displayValue()"
      (blur)="onBlur()"
      (focus)="onFocus()"
      (input)="onInput($event)"
    />

    @if (type() === 'password') {
      <button
        type="button"
        class="flex items-center justify-center shrink-0 text-gray-400 hover:text-gray-600 focus:outline-none transition-colors"
        (click)="togglePassword()"
      >
        <i class="text-lg" [ngClass]="showPassword() ? 'ph-eye-slash' : 'ph-eye'"></i>
      </button>
    }
  </div>

  @if (error()) {
    <span class="text-xs text-red-500 font-medium">{{ error() }}</span>
  }
</div>

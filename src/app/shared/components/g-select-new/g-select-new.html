<div class="hidden">
  <ng-content></ng-content>
</div>

<div class="flex flex-col gap-1.5 w-full" [ngClass]="customClass()">
  @if (label()) {
    <label class="text-sm font-medium text-gray-600">{{ label() }}</label>
  }

  <button
    cdkOverlayOrigin
    #trigger="cdkOverlayOrigin"
    type="button"
    class="relative flex items-center justify-between gap-2 h-14 w-full px-4 bg-white border rounded-xl outline-none transition-colors duration-200 text-left"
    [ngClass]="{
      'border-blue-500 ring-2 ring-blue-50': (isOpen() || isFocused()) && !error(),
      'border-red-500': error(),
      'border-gray-200 hover:border-gray-300': !isOpen() && !isFocused() && !error(),
      'opacity-60 cursor-not-allowed bg-gray-50': isDisabled(),
    }"
    [disabled]="isDisabled()"
    (click)="toggleDropdown()"
  >
    <div class="flex items-center gap-2 overflow-hidden">
      @if (icon()) {
        <span class="flex items-center justify-center shrink-0 text-gray-400">
          <i [class]="icon()"></i>
        </span>
      }
      <span class="text-sm truncate" [ngClass]="hasSelection() ? 'text-gray-800' : 'text-gray-400'">
        {{ displayLabel() }}
      </span>
    </div>

    <span
      class="flex items-center justify-center shrink-0 text-gray-400 transition-transform duration-300"
      [class.rotate-180]="isOpen()"
    >
      <i class="ph-caret-down"></i>
    </span>
  </button>

  <div class="min-h-2">
    @if (error()) {
      <span class="text-xs text-red-500 font-medium animate-fade-in">
        {{ error() }}
      </span>
    }
  </div>
</div>

<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="trigger"
  [cdkConnectedOverlayOpen]="isOpen()"
  [cdkConnectedOverlayHasBackdrop]="true"
  cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
  (backdropClick)="closeDropdown()"
  [cdkConnectedOverlayWidth]="trigger.elementRef.nativeElement.offsetWidth"
>
  <div
    class="mt-1 bg-white border border-gray-100 rounded-xl shadow-lg max-h-60 overflow-y-auto z-50 py-1"
  >
    @for (option of options(); track option.value) {
      <button
        type="button"
        class="flex items-center gap-3 w-full px-4 py-2.5 text-sm text-left transition-colors duration-150 outline-none"
        [ngClass]="{
          'bg-blue-50 text-blue-600 font-medium': option.value === internalValue(),
          'text-gray-700 hover:bg-gray-50 focus:bg-gray-50': option.value !== internalValue(),
        }"
        (click)="selectOption(option)"
      >
        @if (option.icon) {
          <span class="flex items-center justify-center text-gray-400 shrink-0">
            <i [class]="option.icon + ' text-lg'"></i>
          </span>
        }
        <span class="flex-1 truncate">{{ option.label }}</span>

        @if (option.value === internalValue()) {
          <span class="text-blue-600 shrink-0"> <i class="ph-check text-base"></i> </span>
        }
      </button>
    }
  </div>
</ng-template>

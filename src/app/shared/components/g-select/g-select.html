<div class="relative w-full block">
   @if (label()) {
    <label class="text-[0.9375rem] font-medium text-title ">{{ label() }}</label>
  }
  <button
    type="button"
    class="relative mt-2 flex items-center justify-between gap-2 h-12 px-6 py-[16.5px] w-full  bg-white border rounded-xl outline-none transition-colors duration-200 text-left"
    [ngClass]="{
      'border-blue-500 ring-2 ring-blue-50': (isOpen() || isFocused()) && !error(),
      'border-red-500': error(),
      'border-[#EEEEEE] hover:border-gray-300': !isOpen() && !isFocused() && !error(),
      'opacity-60 cursor-not-allowed bg-gray-50': isDisabled(),
    }"
    [disabled]="isDisabled()"
    (click)="toggleDropdown()"
  >
    <div class="flex-1 overflow-hidden truncate">
      @if (hasSelection()) {
        
        <div class="flex items-center gap-2 truncate">
          <span class="text-[15px] font-medium text-gray-800">{{ selectedOption()!.label }}</span>
          
          @if (selectedOption()!.subLabel) {
            <span class="text-[14px] text-blue-500 font-medium">{{ selectedOption()!.subLabel }}</span>
          }
        </div>

      } @else {
        <span class="text-[15px] text-gray-400 font-medium">{{ placeholder() }}</span>
      }
    </div>
    <span
      class="flex items-center justify-center shrink-0 text-gray-400 transition-transform duration-300"
      [class.rotate-180]="isOpen()"
    >
      <g-icon name="chevron-down" size="16"></g-icon>
    </span>
  </button>

  @if (isOpen()) {
    <div
      class="absolute top-[calc(100%+8px)] left-0 w-full bg-white border border-gray-100 rounded-xl shadow-lg max-h-60 overflow-y-auto z-50 py-1"
    >
      @for (option of options(); track option.value) {
        <button
          type="button"
          class="flex items-center gap-3 w-full px-4 py-2 text-left transition-colors duration-150 outline-none"
          [ngClass]="{
            'bg-blue-50/50': option.value === internalValue(),
            'hover:bg-gray-50 focus:bg-gray-50': option.value !== internalValue(),
          }"
          (click)="selectOption(option)"
        >
          <div class="flex-1 w-full">
            <ng-container [ngTemplateOutlet]="option.template"></ng-container>
          </div>

          @if (option.value === internalValue()) {
            <span class="text-blue-500 shrink-0">
              <g-icon name="check" size="20"></g-icon>
            </span>
          }
        </button>
      }
    </div>
  }
</div>

<div class="min-h-2 mt-1">
  @if (error()) {
    <span class="text-xs text-red-500 font-medium animate-fade-in">
      {{ error() }}
    </span>
  }
</div>

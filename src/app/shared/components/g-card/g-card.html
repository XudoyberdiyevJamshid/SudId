<div
  class="g-card h-full p-6 rounded-2xl flex flex-col justify-between gap-5 cursor-pointer transition-all duration-300"
  [style.--icon-bg-color]="bgColor()">
  <div class="flex items-start justify-between">
    <div class="card-icon-wrapper rounded-2xl flex items-center justify-center" [style.color]="color()">
      <g-icon [name]="iconName()" size="32px" color="inherit"></g-icon>
    </div>
    @if (badge()) {
      <span class="text-white text-md font-medium bg-red-500 rounded-xl px-2 py-1">{{ 'COMMON.NEW' }}</span>
    }
  </div>
  <div class="flex flex-col gap-2">
    <h2 class="text-title font-semibold">{{ title() }}</h2>
    <p class="text-md text-subtitle">{{ description() }}</p>
  </div>
</div>

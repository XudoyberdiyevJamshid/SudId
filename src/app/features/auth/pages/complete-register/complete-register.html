<div class="bg-white min-h-screen py-6 md:py-10 lg:py-11 relative">
  <div class="absolute top-4 md:top-11 left-4 md:left-6 lg:left-[56px]">
    <img
      src="assets/images/logo-blue.png"
      class="w-[60px] h-[36px] md:w-[78px] md:h-[48px] object-contain"
    />
  </div>

  <div
    class="absolute top-4 md:top-11 right-4 md:right-6 lg:right-[56px] bg-[#F9F9F9] rounded-lg z-10"
  >
    <app-switch-language></app-switch-language>
  </div>

  <div class="g-container">
    <div
      class="flex items-center gap-2 md:gap-4 mb-8 md:mb-12 pl-1 sm:pl-0 pt-16 md:pt-0 mt-4 md:mt-14 lg:mt-0"
    >
      <button
        [routerLink]="['/login']"
        class="w-10 h-10 md:w-12 md:h-12 shrink-0 rounded-full bg-gray-50 flex items-center justify-center hover:bg-gray-100 transition-colors"
      >
        <g-icon
          class="scale-90 md:scale-100"
          name="arrowlong-right"
          color="#8196A3"
          size="20"
        ></g-icon>
      </button>
      <h1 class="text-2xl md:text-4xl font-semibold text-title">Ro'yxatdan o'tish</h1>
    </div>
    @if (isFetching()) {
      <div class="flex flex-col items-center justify-center py-20">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-[#2C8CE6]"></div>
        <p class="mt-4 text-gray-600 font-medium">Shaxsiy ma'lumotlar yuklanmoqda...</p>
      </div>
    } @else {
      <form [formGroup]="registerForm" class="flex flex-col" (ngSubmit)="onSubmit()">
        <div class="grid grid-cols-1 md:grid-cols-2 md:gap-x-4 md:gap-y-1">
          <g-input formControlName="citizenship" label="Fuqaroligi"></g-input>
          <!-- <g-select formControlName="citizenship" label="Fuqaroligi">
          <g-option value="uzb" label="O'zbekiston Respublikasi fuqarosi">
            <div class="py-1 text-sm md:text-[15px] text-gray-800">
              O'zbekiston Respublikasi fuqarosi
            </div>
          </g-option>

          <g-option value="other" label="Chet el fuqarosi">
            <div class="py-1 text-sm md:text-[15px] text-gray-800">Chet el fuqarosi</div>
          </g-option>
        </g-select> -->

          <g-input
            formControlName="pnfl"
            label="JShShIR"
            [error]="getErrorMessage('pnfl')"
          ></g-input>

          <g-input
            formControlName="username"
            label="Foydalanuvchi nomi"
            [error]="getErrorMessage('username')"
          ></g-input>
          <g-input
            formControlName="password"
            type="password"
            label="Parol"
            [error]="getErrorMessage('password')"
          ></g-input>

          <g-input
            formControlName="phone"
            label="Telefon raqami"
            [error]="getErrorMessage('phone')"
            type="phone"
          ></g-input>
          <g-input
            formControlName="email"
            label="Elektron pochta"
            [error]="getErrorMessage('email')"
          ></g-input>

          <g-input
            formControlName="lastName"
            label="Familiyasi"
            [error]="getErrorMessage('lastName')"
          ></g-input>
          <g-input
            formControlName="firstName"
            label="Ismi"
            [error]="getErrorMessage('firstName')"
          ></g-input>

          <g-input
            formControlName="middleName"
            label="Sharifi"
            [error]="getErrorMessage('middleName')"
          ></g-input>
          <g-input
            formControlName="lastNameCyrillic"
            label="Familiyasi (kirilcha)"
            [error]="getErrorMessage('lastNameCyrillic')"
          ></g-input>

          <g-input
            formControlName="firstNameCyrillic"
            label="Ismi (kirilcha)"
            [error]="getErrorMessage('firstNameCyrillic')"
          ></g-input>
          <g-input
            formControlName="middleNameCyrillic"
            label="Sharifi (kirilcha)"
            [error]="getErrorMessage('middleNameCyrillic')"
          ></g-input>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-x-4">
          <g-input
            formControlName="passport"
            label="Passport seriya raqami"
            [error]="getErrorMessage('passport')"
          ></g-input>
          <g-input
            formControlName="birthDate"
            label="Tug'ilgan sanasi"
            [error]="getErrorMessage('birthDate')"
          ></g-input>
          <g-input
            formControlName="gender"
            label="Jinsi"
            [error]="getErrorMessage('gender')"
          ></g-input>
          <!-- <g-select formControlName="gender" label="Jinsi" placeholder="Tanlang">
          <g-option value="male" label="Erkak"></g-option>
          <g-option value="female" label="Ayol"></g-option>
        </g-select> -->
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-x-4">
          <!-- <g-select formControlName="nationality" label="Millati" placeholder="Tanlang">
          <g-option value="uzb" label="O'zbek"></g-option>
          <g-option value="rus" label="Rus"></g-option>
        </g-select> -->

          <g-input
            formControlName="nationality"
            label="Millati"
            [error]="getErrorMessage('nationality')"
          ></g-input>
          <g-input
            formControlName="address"
            label="Manzili"
            [error]="getErrorMessage('address')"
          ></g-input>
        </div>

        <div class="flex justify-center md:justify-end mt-2 md:mt-4">
          <div class="w-full md:w-[22.375rem]">
            <g-button type="submit" [fullWidth]="true" rounded="sm" size="md">
              Tasdiqlash
              <div
                class="w-6 h-6 md:w-7 md:h-7 rounded-full flex justify-center items-center absolute right-4 md:right-5 bg-white/20"
              >
                <g-icon class="scale-90 md:scale-100" name="arrow-right" size="14"></g-icon>
              </div>
            </g-button>
          </div>
        </div>
      </form>
    }
  </div>
</div>

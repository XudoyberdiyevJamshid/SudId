<g-card>
  <div class="p-4 md:p-6">
    <button
      (click)="goBack()"
      class="bg-[#F9F9F9] text-[#6B7D89] py-2 md:py-[0.625rem] text-xs md:text-[0.8125rem] px-3 rounded-lg flex items-center justify-center w-fit mb-3 gap-1.5 md:gap-2 hover:bg-gray-100"
    >
      <g-icon class="scale-90 md:scale-100" name="chevron-right" color="#6B7D89" size="16"></g-icon>
      <span>Orqaga</span>
    </button>

    <div class="mb-5 md:mb-8">
      <h2 class="font-semibold text-xl md:text-2xl text-title mb-2 md:mb-3">
        Parolni o’zgaritirish
      </h2>

      <div
        class="flex items-center flex-wrap gap-1.5 md:gap-2 text-xs md:text-[13px] font-medium text-gray-400"
      >
        <span class="hover:text-blue-500 cursor-pointer transition-colors" (click)="goBack()">
          Sozlamalar
        </span>
        <g-icon class="scale-90 md:scale-100" name="chevron-left" size="10"></g-icon>
        <span class="text-[#3FA2F6]">Parolni o'zgaritirish</span>
      </div>
    </div>

    <form [formGroup]="passwordForm" class="flex flex-col gap-4" (submit)="onSubmit()">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
        <g-input
          label="Yangi parol"
          placeholder="********"
          type="password"
          formControlName="newPassword"
          [error]="getErrorMessage('newPassword')"
        ></g-input>
        <g-input
          label="Parol tasdig’i"
          placeholder="********"
          type="password"
          formControlName="confirmPassword"
          [error]="getErrorMessage('confirmPassword')"
        ></g-input>
      </div>

      <div class="flex flex-col gap-2 md:gap-3 mt-2 md:mt-4">
        <h3 class="text-sm md:text-[0.9375rem] font-medium text-title">Tasdiqlash</h3>
        <p class="text-xs md:text-[14px] text-subtitle2">
          Parolni saqlash uchun ERI kalitidan foydalaning
        </p>

        <g-select
          placeholder="ERI kalitini tanlang"
          formControlName="eriKey"
          [error]="getErrorMessage('eriKey')"
        >
          @for (key of eriKeys; track key.id) {
            <g-option [value]="key.id" [label]="key.name">
              <div class="flex flex-col p-1 md:p-2">
                <span class="font-medium text-gray-800 text-sm break-words">{{ key.name }}</span>

                <div
                  class="flex flex-wrap items-center gap-2 md:gap-4 text-xs md:text-[13px] text-gray-400 mt-1"
                >
                  <span class="flex items-center gap-1 md:gap-1.5">
                    <g-icon
                      class="scale-90 md:scale-100"
                      name="user"
                      color="#2C8CE6"
                      size="14"
                    ></g-icon>
                    {{ key.jshshir }}
                  </span>
                  <span class="flex items-center gap-1 md:gap-1.5">
                    <g-icon
                      class="scale-90 md:scale-100"
                      name="calendar"
                      color="#2C8CE6"
                      size="14"
                    ></g-icon>
                    {{ key.date }}
                  </span>
                </div>
              </div>
            </g-option>
          }
        </g-select>
      </div>

      <div class="mt-4 md:mt-6 flex justify-end">
        <g-button type="submit" rounded="sm" customClass="w-full md:w-auto md:px-10 relative">
          <p class="mr-4">O'zgartirish</p>
          <div
            class="w-6 h-6 rounded-full flex justify-center items-center absolute right-3 top-1/2 -translate-y-1/2 bg-white/20"
          >
            <g-icon class="scale-90 md:scale-100" name="check-circle" size="12"></g-icon>
          </div>
        </g-button>
      </div>
    </form>
  </div>
</g-card>

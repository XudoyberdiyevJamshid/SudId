<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SudId</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  </head>
  <style>
    #fuse-splash-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;

      background: white;
      z-index: 999999;
      pointer-events: none;
      opacity: 1;
      visibility: visible;
      transition: opacity 400ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    #fuse-splash-screen img {
      width: 150px;
      height: auto;

      animation: pulse-logo 1.5s infinite ease-in-out;
    }

    @keyframes pulse-logo {
      0% {
        transform: scale(0.95);
      }
      50% {
        transform: scale(1.1);
      }
      100% {
        transform: scale(0.95);
      }
    }

    body:not(.fuse-splash-screen-hidden) {
      overflow: hidden;
    }

    body.fuse-splash-screen-hidden #fuse-splash-screen {
      visibility: hidden;
      opacity: 0;
    }
  </style>
  <body>
    <div id="fuse-splash-screen">
      <img alt="MySud Logo" src="assets/images/logo_blue.svg" />
    </div>
    <app-root></app-root>
  </body>
</html>
